<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio - Bui Thanh Hai</title>
    <!-- PDF.js library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <!-- Navigation Bar -->
        <nav class="navbar">
            <div class="nav-links">
                <button class="nav-btn active" data-target="about">ABOUT ME</button>
                <button class="nav-btn" data-target="projects">PROJECTS</button>
            </div>
            <div class="nav-actions">
                <a href="https://raw.githubusercontent.com/haivc2002/CV/main/assets/assets/ThanhHai_mobile.pdf" download="ThanhHai_mobile.pdf" class="btn-download">Download CV</a>
            </div>
        </nav>

        <!-- Main Content Area -->
        <main class="main-content">
            <!-- About Me View -->
            <section id="about" class="view-section active">
                <div class="pdf-container">
                    <div id="pdf-render-area"></div>
                    <div id="pdf-loading" class="loading">Loading CV...</div>
                </div>
            </section>

            <!-- Projects View -->
            <section id="projects" class="view-section">
                <div class="projects-container">
                    <!-- Project groups will be injected here via JS -->
                </div>
            </section>

            <!-- Project Detail View -->
            <section id="project-detail" class="view-section">
                <div class="detail-container">
                    <button class="btn-back" id="btn-back">← Back to Projects</button>
                    <!-- Detail content will be injected here via JS -->
                    <div id="detail-content"></div>
                </div>
            </section>
        </main>
    </div>

    <script src="data.js"></script>
    <script src="app.js"></script>
</body>
</html>
